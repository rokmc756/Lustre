---
- name: Ensure Kernel Headers Available
  package:
    name: epel-release,python3-dnf-plugin-versionlock
    state: present
  register: install_kernel_header
  when: inventory_hostname not in groups['client']


- name: Install Kernel to Support Lustre
  package:
    name: "{{ item }}"
    state: present
  register: install_lustre_kernel_module
  with_items:
    - "kernel-core-{{ _lustre.kernel_version }}_lustre.el9.x86_64"
    - "kernel-devel-{{ _lustre.kernel_version }}_lustre.el9.x86_64"
  when: inventory_hostname not in groups['client']


- name: Reboot Hosts to Apply New Kernel
  import_tasks: ext/reboot-hosts.yml
  when: inventory_hostname not in groups['client']


- name: Lock Kernel Version
  shell: |
    dnf versionlock add kernel-*
  register: lock_kernel_version
  when: inventory_hostname not in groups['client']


- name: Install Lustre Kernel Module
  package:
    name: "kmod-lustre,kmod-lustre-devel"
    state: present
  register: install_lustre_kernel_module
  when: inventory_hostname not in groups['client']
  # name: "kmod-lustre-{{ lustre_version }},kmod-lustre-devel-{{ lustre_version }}"


- name: Install Lustre Packages
  package:
    name: "lustre-{{ lustre_version }}"
    state: present
  register: install_lustre_pkgs
  when: inventory_hostname not in groups['client']


- name: Install Lustre Kernel Module
  package:
    name: "lustre-osd-ldiskfs-mount"
    state: present
  register: install_lustre_kernel_module
  when: inventory_hostname not in groups['client']
  # name: "kmod-lustre-osd-zfs"


- name: Install Lustre Filesystem Utility
  package:
    name: "lustre-osd-zfs-mount"
    state: present
  register: install_lustre_fs_util
  when: inventory_hostname not in groups['client']


- name: Ensure Kernel Headers Available
  package:
    name: kernel-devel,epel-release,python3-dnf-plugin-versionlock
    state: present
  register: install_kernel_header
  when: inventory_hostname in groups['client']


- name: Install Lustre Client Kernel Module
  package:
    name: "kmod-lustre-client-{{ lustre_version }}"
    state: present
  register: install_lustre_client_kmods
  when: inventory_hostname in groups['client']


- name: Install Lustre Client
  package:
    name: "lustre-client-{{ lustre_version }}"
    state: present
  register: install_lustre_client
  when: inventory_hostname in groups['client']


- name: Set GRUB_DEFAULT in /etc/default/grub
  lineinfile:
    path: "/etc/default/grub"
    regexp: "^GRUB_DEFAULT="
    line: "GRUB_DEFAULT=\"{{ _lustre.grub_lustre_entry }}\""
    create: yes
  register: set_grbu_default


- name: Update GRUB
  shell: |
    grub2-mkconfig -o /boot/grub2/grub.cfg
  register: update_grub
  when: ansible_distribution == "CentOS" or ansible_os_family == "RedHat" or ansible_os_family == "Rocky"


- name: Put SELinux in permissive mode, logging actions that would be blocked.
  selinux:
    policy: targeted
    state: permissive


- name: Rebuild Init RAM Disk
  shell:
    dracut -f --regenerate-all


- name: Save Lustre Kernel Module
  template:
    src: "{{ item.fn }}.conf.j2"
    dest: "{{ item.dst }}"
    mode: 0644
  with_items:
    - { fn: "lustre", dst: "/etc/modprobe.d/lustre.conf" }


- name: Reboot Hosts to Apply New Kernel
  import_tasks: ext/reboot-hosts.yml

